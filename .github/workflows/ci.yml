name: CI

on:
  push:
    branches:
      - main
  pull_request:
    types: [labeled, opened, reopened, synchronize]

concurrency:
  group: ${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  ci:
    uses: 34j/.github/.github/workflows/python-package-ci.yml@b2cda1ee6a021b96107ec82577111ec6df44e5ad # main
    permissions:
      attestations: write
      contents: write
      id-token: write
  publish:
    if: needs.ci.outputs.released == 'true'
    needs: ci
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: python-package-dist
          path: dist
      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
