[build-system]
build-backend = "setuptools.build_meta"
requires = [ "setuptools>=77.0.3" ]

[project]
name = "decryptpdf"
version = "1.2.0"
description = "Simple CLI tool for decrypting PDF files."
readme = "README.md"
license = "MIT"
authors = [
  { name = "34j" },
]
requires-python = ">=3.13"
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "Natural Language :: English",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Libraries",
]
dependencies = [
  "pikepdf>=9.8.1",
  "rich>=10",
  "tqdm>=4.67.1",
  "typer>=0.15,<1",
]
urls."Bug Tracker" = "https://github.com/34j/decryptpdf/issues"
urls.Changelog = "https://github.com/34j/decryptpdf/blob/main/CHANGELOG.md"
urls.documentation = "https://decryptpdf.readthedocs.io"
urls.repository = "https://github.com/34j/decryptpdf"
scripts.decryptpdf = "decryptpdf.cli:app"

[dependency-groups]
dev = [
  "coverage",
  "packaging-34j[test]",
  "pytest",
  "pytest-cov",
  "ty",
]
docs = [
  "packaging-34j[docs]",
]

[tool.ruff]
extend = ".venv/ruff.toml"
lint.per-file-ignores."tests/**/*" = [ "S603" ]

[tool.pyproject-fmt]
max_supported_python = "3.14"

[tool.ty]
terminal.error-on-warning = true
